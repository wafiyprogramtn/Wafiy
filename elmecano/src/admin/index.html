<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07070d">
<title>Demandes — El Mecano Admin</title>
<link rel="icon" type="image/png" href="../assets/favicon-64.png">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form class="login-card" id="loginForm">
    <img src="../assets/logo.png" alt="El Mecano Garage">
    <h1>Espace administrateur</h1>
    <p>Connectez-vous pour voir les demandes d’inscription.</p>
    <label for="pw">Mot de passe</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn btn-red" type="submit">Se connecter</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <header class="top">
    <img src="../assets/logo.png" alt="El Mecano Garage" class="top-logo">
    <div class="top-title"><b>Demandes</b><small id="updated">—</small></div>
    <div class="top-actions">
      <button class="btn btn-ghost" id="refresh" title="Actualiser">⟳<span> Actualiser</span></button>
      <a class="btn btn-ghost" id="export" href="/api/admin/export">⇩<span> Export Excel</span></a>
      <button class="btn btn-ghost" id="logout">Déconnexion</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <section class="filters">
    <input type="search" id="q" placeholder="Rechercher : nom, téléphone, email, ville…">
    <select id="fFormation"><option value="">Toutes les formations</option></select>
    <select id="fStatut"><option value="">Tous les statuts</option></select>
  </section>

  <section class="list" id="list"></section>
  <p class="empty" id="empty" hidden>Aucune demande pour le moment.</p>
</div>
<script src="admin.js"></script>
</body>
</html>
